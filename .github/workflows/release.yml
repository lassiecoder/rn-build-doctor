name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - name: Tag matches package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Publish (prerelease versions go to the "next" tag)
        run: |
          if node -p 'require("./package.json").version' | grep -q -- '-'; then
            npm publish --tag next
          else
            npm publish
          fi
      - name: GitHub release
        run: |
          PRERELEASE=$(node -p 'require("./package.json").version.includes("-") ? "--prerelease" : ""')
          gh release create "$GITHUB_REF_NAME" --generate-notes $PRERELEASE
        env:
          GH_TOKEN: ${{ github.token }}
