name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - name: Rule catalog is up to date
        run: npm run catalog && git diff --exit-code docs/supported-checks.md
      - run: npm audit --omit=dev --audit-level=high

  test:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  package:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack and install into a clean project
        run: |
          npm pack
          mkdir -p /tmp/smoke && cd /tmp/smoke
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/rn-build-doctor-*.tgz
          npx rn-build-doctor --version
          npx rn-build-doctor doctor >/dev/null
          npx rn-build-doctor analyze "$GITHUB_WORKSPACE/tests/fixtures/logs/android-agp-jdk.log" --no-save --fail-on error && exit 1 || test $? -eq 1
          npx rn-build-doctor scan --cwd "$GITHUB_WORKSPACE/tests/fixtures/projects/expo-clean" --no-save
